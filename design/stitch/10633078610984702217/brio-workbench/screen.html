<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Brio - 让表达恰如其分</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: {
              950: '#090a0f',
              900: '#0e1117',
              850: '#131722',
              800: '#181e2b',
              700: '#222938',
              600: '#323c52',
            },
            accent: {
              blue: '#2563eb',
              hover: '#1d4ed8',
              glow: '#3b82f6',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Segoe UI"', 'Roboto', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          boxShadow: {
            'window': '0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12)',
            'glow-blue': '0 0 20px -3px rgba(37, 99, 235, 0.45)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Glass & Micro-Interactions CSS -->
<style data-purpose="hud-styling">
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Backdrop noise overlay simulation */
    .glass-acrylic {
      background: rgba(14, 17, 23, 0.88);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }

    /* Subtle cursor blinking caret effect */
    .custom-caret {
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
<!-- END: Custom Glass & Micro-Interactions CSS -->
</head>
<body class="min-h-screen bg-neutral-950 flex items-center justify-center p-4 sm:p-6 text-slate-100 font-sans antialiased selection:bg-blue-600/30 selection:text-blue-200">
<!-- BEGIN: Floating HUD Window Container -->
<main class="w-full max-w-[620px] rounded-2xl glass-acrylic border border-white/10 shadow-window overflow-hidden flex flex-col transition-all duration-200 ring-1 ring-black/40" data-purpose="main-floating-window" id="brio-hud">
<!-- BEGIN: Header Bar -->
<header class="flex items-center justify-between px-4 py-3.5 border-b border-white/[0.07] select-none bg-white/[0.02]" data-purpose="window-header">
<!-- Logo, App Title and Slogan -->
<div class="flex items-center space-x-2.5">
<div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-blue-700 via-indigo-600 to-sky-400 p-[1px] shadow-sm">
<div class="w-full h-full bg-obsidian-950/80 rounded-[7px] flex items-center justify-center backdrop-blur-sm">
<!-- Fountain Pen / Nib Icon for Brio Polishing -->
<svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="m12 19 7-7 3 3-7 7-3-3z"></path>
<path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
<path d="m2 2 7.586 7.586"></path>
<circle cx="11" cy="11" r="2"></circle>
</svg>
</div>
</div>
<div class="flex items-baseline space-x-2.5">
<h1 class="text-sm font-semibold tracking-wide text-white">Brio</h1>
<span class="text-xs text-slate-400 font-normal">让表达恰如其分</span>
</div>
</div>
<!-- Window Action Controls -->
<div class="flex items-center space-x-1">
<!-- Pin Window Button -->
<button aria-label="固定窗口" class="p-1.5 rounded-md text-slate-400 hover:text-slate-200 hover:bg-white/[0.07] transition-colors focus:outline-none" title="保持窗口在最前" type="button">
<svg class="w-4 h-4 transform -rotate-45" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="12" x2="12" y1="17" y2="22"></line>
<path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
</svg>
</button>
<!-- Close Window Button -->
<button aria-label="关闭窗口" class="p-1.5 rounded-md text-slate-400 hover:text-rose-300 hover:bg-rose-500/20 transition-colors focus:outline-none" title="关闭 (Esc)" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M18 6 6 18"></path>
<path d="m6 6 12 12"></path>
</svg>
</button>
</div>
</header>
<!-- END: Header Bar -->
<!-- BEGIN: Body Content -->
<div class="p-4 sm:p-5 flex flex-col gap-4 overflow-y-auto max-h-[82vh]">
<!-- BEGIN: Source Text Section -->
<section class="flex flex-col space-y-2" data-purpose="source-section">
<div class="flex items-center justify-between text-xs px-0.5 select-none">
<div class="flex items-center space-x-1.5 font-medium text-slate-300">
<!-- Paragraph / Source text icon -->
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 12h16M4 6h16M4 18h10"></path>
</svg>
<span>原文</span>
</div>
<span class="text-[11px] text-slate-400 flex items-center gap-1.5">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500/70"></span>
            可直接编辑
          </span>
</div>
<!-- Source Text Box -->
<div class="relative group rounded-xl bg-obsidian-900/90 border border-white/[0.08] hover:border-white/15 focus-within:border-blue-500/60 focus-within:ring-1 focus-within:ring-blue-500/30 transition-all duration-150 shadow-inner">
<textarea class="w-full bg-transparent px-3.5 py-3 text-xs leading-relaxed text-slate-200 placeholder-slate-500 border-0 resize-none focus:ring-0 focus:outline-none font-normal" placeholder="在此输入或粘贴需要润色或翻译的文本..." rows="4">documents the prototype, build flow, Accessibility requirement, and distribution path.
- No testimonials, customer logos, benchmarks, press coverage, or production usage data exist. Future work must not fabricate them.
- No committed screenshots or design-system record exist yet.</textarea>
</div>
</section>
<!-- END: Source Text Section -->
<!-- BEGIN: Action & Scene Mode Bar -->
<section class="flex items-center justify-between gap-3 py-1" data-purpose="mode-bar">
<!-- Scene Selector Pill -->
<div class="flex items-center space-x-2.5">
<div class="relative inline-flex items-center">
<button class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-obsidian-800/90 hover:bg-obsidian-700/80 border border-white/10 text-xs text-slate-200 font-medium transition-colors shadow-sm focus:outline-none" type="button">
<span>中英互译</span>
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="m6 9 6 6 6-6"></path>
</svg>
</button>
</div>
<span class="text-xs text-slate-400 hidden sm:inline">自然翻译，不拘泥字句</span>
</div>
<!-- Primary Action Trigger -->
<button class="inline-flex items-center space-x-1.5 px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-xs font-medium text-white shadow-glow-blue border border-blue-400/30 transition-all select-none" type="button">
<span>开始翻译</span>
<kbd class="hidden sm:inline-block font-mono text-[10px] bg-blue-700/80 px-1.5 py-0.5 rounded text-blue-100 ml-1 border border-blue-400/20">⌘⏎</kbd>
</button>
</section>
<!-- END: Scene Mode Bar -->
<!-- BEGIN: Output Result Section -->
<section class="flex flex-col space-y-2" data-purpose="output-section">
<div class="flex items-center justify-between text-xs px-0.5 select-none">
<div class="flex items-center space-x-1.5 font-medium text-slate-300">
<!-- Shield Check / Output Target Icon -->
<svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path>
<path d="m9 12 2 2 4-4"></path>
</svg>
<span>翻译结果</span>
</div>
<div class="flex items-center space-x-1 text-[11px] text-slate-400">
<span class="px-1.5 py-0.5 rounded bg-white/[0.05] border border-white/[0.06] text-slate-400">高质精简</span>
</div>
</div>
<!-- Result Text Area Card -->
<div class="relative rounded-xl bg-obsidian-900/90 border border-white/[0.08] p-3.5 text-xs text-slate-100 leading-relaxed space-y-1.5 shadow-inner">
<p class="font-normal text-slate-200">记录了原型、构建流程、可访问性要求和分发路径。</p>
<p class="text-slate-300">- 不存在推荐语、客户徽标、基准数据、媒体报道或生产使用数据。未来工作不得虚构这些内容。</p>
<p class="text-slate-300">- 尚未有已提交的截图或设计系统记录。<span class="inline-block w-0.5 h-3.5 bg-blue-500 ml-0.5 align-middle custom-caret"></span></p>
</div>
</section>
<!-- END: Output Result Section -->
</div>
<!-- END: Body Content -->
<!-- BEGIN: Footer Toolbar & Follow-up Prompt Box -->
<footer class="p-4 bg-obsidian-900/60 border-t border-white/[0.07] flex flex-col space-y-3" data-purpose="hud-footer">
<!-- Quick Action Buttons Row -->
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<!-- Copy Result Button -->
<button class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/10 active:bg-white/[0.04] border border-white/[0.08] text-xs text-slate-300 hover:text-white transition-colors select-none" type="button">
<span>复制结果</span>
<kbd class="font-mono text-[10px] text-slate-400 bg-black/30 px-1 py-0.5 rounded border border-white/5">⌘C</kbd>
</button>
<!-- Copy and Close Button -->
<button class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-xs font-medium text-white shadow-sm transition-colors select-none" type="button">
<span>复制并关闭</span>
<kbd class="font-mono text-[10px] text-blue-200 bg-blue-800/60 px-1 py-0.5 rounded border border-blue-400/20">⏎</kbd>
</button>
</div>
<!-- Regenerate Action -->
<button aria-label="重新生成" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-white/[0.06] border border-transparent hover:border-white/[0.08] transition-colors focus:outline-none" title="重新生成" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
<path d="M3 3v5h5"></path>
<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
<path d="M16 21h5v-5"></path>
</svg>
</button>
</div>
<!-- Follow-up / Refine Chat Input -->
<div class="relative flex items-center">
<!-- Message Icon -->
<div class="absolute left-3.5 text-slate-500 pointer-events-none flex items-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
</div>
<input class="w-full bg-obsidian-950/80 border border-white/10 rounded-xl pl-10 pr-10 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/30 transition-all" placeholder="继续调整，例如：再自然一点，缩短一半" type="text"/>
<!-- Enter / Submit Arrow -->
<button aria-label="提交调整" class="absolute right-2 p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="m5 12 7-7 7 7"></path>
<path d="M12 19V5"></path>
</svg>
</button>
</div>
</footer>
<!-- END: Footer Toolbar & Follow-up Prompt Box -->
</main>
<!-- END: Floating HUD Window Container -->
</body></html>
