<script data-purpose="form-interactions">
    // Key Reveal Toggle
    const toggleBtn = document.getElementById('toggle-key-visibility');
    const keyInput = document.getElementById('api-key-input');

    if (toggleBtn && keyInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = keyInput.getAttribute('type') === 'password';
        keyInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.classList.toggle('text-blue-400');
      });
    }

    // Save notification simulation
    const saveBtn = document.getElementById('save-settings-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = `
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>已保存</span>
        `;
        setTimeout(() => {
          saveBtn.innerHTML = originalText;
        }, 1200);
      });
    }
  </script>
